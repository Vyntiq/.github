name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: What happened, description: "And what you expected instead."}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Steps to reproduce, placeholder: "1. …\n2. …\n3. …"}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Version, build or commit}
  - type: textarea
    id: env
    attributes: {label: Environment, description: "OS, browser, database, deployment."}
  - type: textarea
    id: logs
    attributes: {label: Logs or screenshots, description: "Remove secrets and customer data first.", render: text}
