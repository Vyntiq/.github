name: Feature request
description: Propose a new capability or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem, description: "Who needs this, and what can they not do today?"}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed solution}
  - type: textarea
    id: acceptance
    attributes: {label: Acceptance criteria, description: "How will we know it is done?"}
